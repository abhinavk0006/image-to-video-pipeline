<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratory motion review</title>
<style>body{font:16px system-ui;margin:24px auto;padding:0 16px;max-width:1000px;background:#142130;color:#e5edf7}button,select,input,textarea{font:inherit;padding:8px;border-radius:6px}label{display:inline-flex;gap:8px;align-items:center;margin:5px}canvas{width:100%;height:auto;background:#172638;border-radius:8px}textarea{display:block;width:95%;margin:12px 0}small{color:#baccdf}input[type=range]{max-width:100%}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}</style>
<h1>Laboratory motion review</h1><p>Draft geometry and timing only. No fluid simulation, calibrated dose, hands or chemical reaction. Teal marks are delivery/path cues.</p>
<div class="controls"><label>Movement <select id="motion"><option value="dropper">Dropper approach / delivery / withdrawal</option><option value="pour">Pour posture</option><option value="stir">Circular stirring</option></select></label><button id="play">Play</button><button id="back">Previous frame</button><button id="next">Next frame</button><label>Speed <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label></div>
<canvas id="scene" width="960" height="540" aria-label="Three-dimensional laboratory movement preview"></canvas>
<label style="display:flex">Timeline <input id="time" type="range" min="0" max="192" value="0" style="flex:1"></label>
<div class="controls"><label>Camera yaw <input id="yaw" type="range" min="-90" max="90" value="28"></label><label>Camera elevation <input id="pitch" type="range" min="0" max="60" value="22"></label></div>
<p id="phase" aria-live="polite"></p>
<h2>Your review</h2><p>Check the path, clearances, collisions and pacing. Approval here concerns this motion only, not science or model suitability.</p>
<label>Decision <select id="decision"><option value="pending">Not reviewed</option><option value="revise">Needs changes</option><option value="approved_motion_only">Approve movement only</option></select></label>
<textarea id="notes" rows="3" placeholder="For example: dropper, 3 seconds: keep the tip higher; pour: tilt more slowly."></textarea><button id="save">Download review JSON</button><small id="saved"></small>
<script id="data" type="application/json">DATA_PLACEHOLDER</script><script>
const data=JSON.parse(document.getElementById('data').textContent),el=id=>document.getElementById(id),ctx=el('scene').getContext('2d');let running=false,last=0,frame=0;const reviews={};
const colors={glass:'#9caec7',tool:'#eac27b',cue:'#68d7cb',x:'#ef989c',y:'#9bd4ab',z:'#9cb9ef'};
function project(p){let a=Number(el('yaw').value)*Math.PI/180,b=Number(el('pitch').value)*Math.PI/180;let x=p[0]*Math.cos(a)-p[2]*Math.sin(a),z=p[0]*Math.sin(a)+p[2]*Math.cos(a),y=p[1]-1.5;return [480+155*x,270-145*(y*Math.cos(b)-z*Math.sin(b))]}
function draw(){const f=data.motions[el('motion').value][Math.round(frame)];ctx.clearRect(0,0,960,540);for(const path of f.paths){ctx.strokeStyle=colors[path.color];ctx.lineWidth=path.width;ctx.beginPath();path.points.forEach((p,i)=>{const [x,y]=project(p);if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y)});ctx.stroke()}for(const m of f.markers){const[x,y]=project(m.point);ctx.fillStyle=colors[m.color];ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill()}el('time').value=Math.round(frame);el('phase').textContent=f.t.toFixed(2)+'s — '+f.phase+(f.tip_clearance===null?'':' · Tip clearance '+f.tip_clearance.toFixed(2)+' illustrative units')}
function retain(){reviews[el('motion').value]={decision:el('decision').value,notes:el('notes').value,frame:Math.round(frame)}}
el('motion').onfocus=retain;let previous='dropper';el('motion').onchange=()=>{reviews[previous]={decision:el('decision').value,notes:el('notes').value};previous=el('motion').value;const r=reviews[previous]||{};el('decision').value=r.decision||'pending';el('notes').value=r.notes||'';frame=0;running=false;el('play').textContent='Play';draw()};
el('play').onclick=()=>{if(frame>=192)frame=0;running=!running;el('play').textContent=running?'Pause':'Play'};
function step(delta){running=false;el('play').textContent='Play';frame=Math.max(0,Math.min(192,Math.round(frame)+delta));draw()};el('back').onclick=()=>step(-1);el('next').onclick=()=>step(1);el('time').oninput=()=>{frame=Number(el('time').value);step(0)};el('yaw').oninput=draw;el('pitch').oninput=draw;
el('save').onclick=()=>{retain();const blob=new Blob([JSON.stringify({schema_version:1,template_sha256:data.template_sha256,scope:'motion_geometry_only',reviewed_at:new Date().toISOString(),reviews},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='laboratory-motion-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);el('saved').textContent=' Review downloaded; share the file or paste your notes here.'};
function tick(t){if(running&&last){frame=Math.min(192,frame+(t-last)/1000*24*Number(el('speed').value));if(frame===192){running=false;el('play').textContent='Play'}draw()}last=t;requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);
</script></html>
